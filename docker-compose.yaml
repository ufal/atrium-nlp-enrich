services:
  nlp:
    image: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
    build:
      context: .
      target: base
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
      ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
      ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./config_api.txt:/app/config_api.txt:ro

  nlp-api:
    profiles: [api]
    image: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-api
    build:
      context: .
      target: api
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-api
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      MAX_CONCURRENT_JOBS: "2"
      DEFAULT_KW_METHOD: "keybert"
      HF_HOME: /cache/huggingface
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./config_api.txt:/app/config_api.txt:ro
    ports:
      - "8000:8000"
    # HEALTHCHECK is already declared on the `api` Dockerfile stage — no override
    # needed here. stop_grace_period raised from Compose's own 10s default (issue
    # #55): the api stage's ENTRYPOINT sets --timeout-graceful-shutdown 20, and
    # serve_lifecycle's own drain adds up to another 25s on top for a tracked
    # /jobs run — 10s would SIGKILL before either has a chance to finish. Same
    # budget as docs/templates/k8s/atrium-service.deployment.yaml's
    # terminationGracePeriodSeconds (Compose has no preStop-hook equivalent).
    stop_grace_period: 60s

  nlp-llm:
    profiles: [llm]
    image: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
    build:
      context: .
      target: llm
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
      ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
      ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./llm_config.txt:/app/llm_config.txt:ro

volumes:
  hf-cache:
