services:
  nlp:
    image: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
    build:
      context: .
      target: base
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}
      ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
      ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
      HF_HOME: /cache/huggingface
      # Backing service endpoints (atrium-project#63). Compose injects ONLY what
      # is listed here, so without these two lines `UDPIPE_URL=... docker compose
      # up` never reaches the container and the endpoints are attachable in the
      # process but unreachable from outside it. Same shape as PORT in the api
      # service below (atrium-project#58).
      #
      # The empty default is deliberate: the variable is then always present but
      # blank when the operator sets nothing, and blank means "unset" to both
      # config_api.txt's ${UDPIPE_URL:-...} and the helper scripts' argparse
      # defaults. Repeating the LINDAT literal here would make it a fourth copy.
      UDPIPE_URL: ${UDPIPE_URL:-}
      NAMETAG_URL: ${NAMETAG_URL:-}
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./config_api.txt:/app/config_api.txt:ro

  nlp-api:
    profiles: [api]
    image: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-api
    build:
      context: .
      target: api
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-api
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      MAX_CONCURRENT_JOBS: "2"
      DEFAULT_KW_METHOD: "keybert"
      HF_HOME: /cache/huggingface
      PORT: ${PORT:-8000}
      # Also needed on the api service: /info reports these and ?deep=true
      # probes them, and both must name the endpoint the pipeline calls.
      UDPIPE_URL: ${UDPIPE_URL:-}
      NAMETAG_URL: ${NAMETAG_URL:-}
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./config_api.txt:/app/config_api.txt:ro
    ports:
    # PORT is passed through so `PORT=9000 docker compose --profile api up` moves the
    # listener, the published port and the container's own HEALTHCHECK together — the
    # service reads it in service/api.py's __main__ block and service/healthcheck.py
    # probes it. (atrium-project#58)
      - "${PORT:-8000}:${PORT:-8000}"
    # HEALTHCHECK is already declared on the `api` Dockerfile stage — no override
    # needed here. stop_grace_period raised from Compose's own 10s default (issue
    # #55): the api stage's ENTRYPOINT sets --timeout-graceful-shutdown 20, and
    # serve_lifecycle's own drain adds up to another 25s on top for a tracked
    # /jobs run — 10s would SIGKILL before either has a chance to finish. Same
    # budget as docs/templates/k8s/atrium-service.deployment.yaml's
    # terminationGracePeriodSeconds (Compose has no preStop-hook equivalent).
    stop_grace_period: 60s

  nlp-llm:
    profiles: [llm]
    image: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
    build:
      context: .
      target: llm
      args:
        ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
        ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
        ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
    environment:
      ATRIUM_RUNNER_IMAGE: ghcr.io/ufal/atrium-nlp-enrich:${ATRIUM_VERSION:-dev}-llm
      ATRIUM_RUNNER_REPO: https://github.com/ufal/atrium-nlp-enrich
      ATRIUM_RUNNER_REF: ${ATRIUM_RUNNER_REF:-dev}
      HF_HOME: /cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data:/data
      - hf-cache:/cache/huggingface
      - ./llm_config.txt:/app/llm_config.txt:ro

volumes:
  hf-cache:
