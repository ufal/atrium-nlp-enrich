# GPU override — combine with docker-compose.yaml:
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml run --rm nlp
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml --profile llm run --rm nlp-llm
#
# Requires NVIDIA Container Toolkit on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html

services:
  nlp:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nlp-llm:
    profiles: [llm]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
