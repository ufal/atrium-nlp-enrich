# .github/workflows/lindat-daily.yml
# A manual check of the live LINDAT UDPipe and NameTag services (atrium-project#78), run by dispatch
# (Actions -> LINDAT check (manual) -> Run workflow), for example before a release or when LINDAT misbehaves.
# The file keeps its old name, lindat-daily.yml, so links and tests still find it.
#
# Every other lane mocks LINDAT. This one sends UDPipe the same short Czech sentence, and NameTag the
# same CoNLL-U of it, 6 times each on a fresh connection and 6 times over one keep-alive session
# (24 requests), with eval/lindat_probe.py, and fails when a reply is bad: an HTTP error or timeout,
# UDPipe's analysis of another text (token count, stray tokens, changed lemmas), or NameTag's tags
# without the sentence's person and place. Repeating the request is the point: one broken replica
# behind LINDAT's balancer answers only some requests wrongly. The translator has the same check for
# LINDAT Translation (its lindat-daily.yml).
#
# The probe's summary, with the pattern per service and mode and the first bad reply, is in the run's
# summary page. It ran daily until the CI agreement of 11 November 2026 (pull requests and releases
# only, no scheduled runs); docs/decisions/e2e-lanes.md in the hub has the history.
#
# It installs only `requests`: the probe needs nothing else, and the lane stays a minute long.

name: LINDAT check (manual)

# Its own group, so it never queues behind or cancels the smoke test.
concurrency:
  group: lindat-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  lindat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install the probe's one dependency
        run: python -m pip install requests

      - name: Probe UDPipe and NameTag (24 requests)
        shell: bash
        run: |
          python -m eval.lindat_probe --n 6 --pause 0.5 --max-bad 0 | tee probe.txt
          rc=${PIPESTATUS[0]}
          {
            echo '### LINDAT daily check (UDPipe, NameTag)'
            echo
            echo '```'
            sed -n '/── summary/,$p' probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
